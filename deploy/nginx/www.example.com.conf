# 主站 SPA Nginx 配置（若前端采用宝塔托管旧方案时参考；
# 最终方案前端部署在 EdgeOne Pages，此文件仅保留作备用说明）

server {
    listen 80;
    server_name www.example.com;

    root /www/wwwroot/furry-zjut/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:env|ini|log|sql|bak|conf|pem|key)$ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}